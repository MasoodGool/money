# Local/dev compose. Phase 4 adds docker-compose.prod.yml for the GCP VM.
#
# The Concierge is the whole runtime: it reads the followed X account, has
# Claude classify each tweet, and executes the calls through the risk gate.
#
# Safe by default: with no .env, the Concierge boots with KILL_SWITCH on and
# BINANCE_TESTNET on, so `docker compose up` trades nothing. Without
# X_BEARER_TOKEN + ANTHROPIC_API_KEY the tweet feed stays off and says so.
#
# freqtrade is now OPTIONAL and off by default — it is kept only for
# backtesting research, behind the `freqtrade` profile:
#     docker compose --profile freqtrade up -d
#
# Hard invariants embodied here:
#   - freqtrade image is version-pinned (never `latest`)
#   - freqtrade runs `trade` against config.dryrun.json (dry_run: true)
#   - no public ports: the Concierge binds to 127.0.0.1 only

services:
  concierge:
    build: ./concierge
    container_name: concierge
    restart: unless-stopped
    environment:
      - PORT=3000
      # Execution (auto-arms only when you set KILL_SWITCH=0 in .env).
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-1}
      - KILL_SWITCH=${KILL_SWITCH:-1}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - STATE_DB_PATH=/data/concierge-state.sqlite
      - JOURNAL_DB_PATH=/data/concierge-journal.sqlite
      - RISK_EQUITY=${RISK_EQUITY:-1000}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.01}
      - RISK_MAX_POSITION_PCT=${RISK_MAX_POSITION_PCT:-0.20}
      - RISK_DAILY_LOSS_LIMIT=${RISK_DAILY_LOSS_LIMIT:-0.03}
      - RISK_STOP_LOSS_PCT=${RISK_STOP_LOSS_PCT:-0.05}
      - RISK_TAKE_PROFIT_PCT=${RISK_TAKE_PROFIT_PCT:-0.08}
      # Tweet signal source. The feed stays off unless both keys are present.
      - X_BEARER_TOKEN=${X_BEARER_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TWEET_HANDLE=${TWEET_HANDLE:-TradexWhisperer}
      - TWEET_SIGNALS_ENABLED=${TWEET_SIGNALS_ENABLED:-1}
      - TWEET_ANALYST_MODEL=${TWEET_ANALYST_MODEL:-claude-opus-5}
      - TWEET_POLL_SECONDS=${TWEET_POLL_SECONDS:-60}
      - TWEET_BACKFILL_DAYS=${TWEET_BACKFILL_DAYS:-30}
      - TWEET_ASSETS=${TWEET_ASSETS:-BTC,ETH,SOL}
      - TWEET_MIN_CONFIDENCE=${TWEET_MIN_CONFIDENCE:-0.75}
      - TWEET_MIN_CONVICTION=${TWEET_MIN_CONVICTION:-medium}
      - TWEET_MAX_AGE_MINUTES=${TWEET_MAX_AGE_MINUTES:-30}
      - TWEET_ALLOW_SPECULATIVE=${TWEET_ALLOW_SPECULATIVE:-0}
      - TWEET_DB_PATH=/data/concierge-tweets.sqlite
    volumes:
      # Persist state + journal across `docker compose down/up`.
      - concierge_data:/data
    ports:
      # Loopback-only so local curl can simulate webhooks; never 0.0.0.0.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  freqtrade:
    # OPTIONAL: research/backtesting only, not the signal source any more.
    # Start it explicitly with `docker compose --profile freqtrade up -d`.
    profiles: ["freqtrade"]
    # Pinned release — bump deliberately, with changelog review (Phase 4 rule).
    image: freqtradeorg/freqtrade:2025.12
    container_name: freqtrade
    restart: unless-stopped
    depends_on:
      concierge:
        condition: service_healthy
    volumes:
      - ./bot/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config/config.dryrun.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  concierge_data:

