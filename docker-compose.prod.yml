# Production compose for the GCP e2-small VM. Differs from the dev compose:
#   - secrets come from .env (chmod 600 on the VM)
#   - the Concierge auto-executes, so it gets the trade key + persistent state
#   - freqtrade runs FreqUI (loopback only) and native Telegram for summaries
#   - log rotation on every service
#
# Bring up with:
#   docker compose -f docker-compose.prod.yml up -d
#
# Hard invariants enforced here:
#   - no public ports (FreqUI on 127.0.0.1 only; Concierge not published)
#   - freqtrade stays dry_run (signal generator); Concierge executes

services:
  concierge:
    build: ./concierge
    container_name: concierge
    restart: unless-stopped
    environment:
      - PORT=3000
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-1}
      - KILL_SWITCH=${KILL_SWITCH:-1}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SENTRY_DSN=${SENTRY_DSN}
      - STATE_DB_PATH=/data/concierge-state.sqlite
      - JOURNAL_DB_PATH=/data/concierge-journal.sqlite
      - RISK_EQUITY=${RISK_EQUITY:-1000}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.01}
      - RISK_MAX_POSITION_PCT=${RISK_MAX_POSITION_PCT:-0.20}
      - RISK_DAILY_LOSS_LIMIT=${RISK_DAILY_LOSS_LIMIT:-0.03}
      - RISK_STOP_LOSS_PCT=${RISK_STOP_LOSS_PCT:-0.05}
      - RISK_TAKE_PROFIT_PCT=${RISK_TAKE_PROFIT_PCT:-0.08}
      # Tweet signal source (primary). Feed stays off unless both keys exist.
      - X_BEARER_TOKEN=${X_BEARER_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TWEET_HANDLE=${TWEET_HANDLE:-TradexWhisperer}
      - TWEET_SIGNALS_ENABLED=${TWEET_SIGNALS_ENABLED:-1}
      - TWEET_ANALYST_MODEL=${TWEET_ANALYST_MODEL:-claude-opus-5}
      - TWEET_POLL_SECONDS=${TWEET_POLL_SECONDS:-60}
      - TWEET_BACKFILL_DAYS=${TWEET_BACKFILL_DAYS:-30}
      - TWEET_ASSETS=${TWEET_ASSETS:-BTC,ETH,SOL}
      - TWEET_MIN_CONFIDENCE=${TWEET_MIN_CONFIDENCE:-0.75}
      - TWEET_MIN_CONVICTION=${TWEET_MIN_CONVICTION:-medium}
      - TWEET_MAX_AGE_MINUTES=${TWEET_MAX_AGE_MINUTES:-30}
      - TWEET_ALLOW_SPECULATIVE=${TWEET_ALLOW_SPECULATIVE:-0}
      - TWEET_DB_PATH=/data/concierge-tweets.sqlite
    volumes:
      # Durable executor state (open positions, idempotency, daily tally).
      - concierge_data:/data
    # Not published: only freqtrade (same compose network) calls it.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  freqtrade:
    # OPTIONAL research container — the tweet feed is the signal source now.
    # Start with: docker compose -f docker-compose.prod.yml --profile freqtrade up -d
    profiles: ["freqtrade"]
    image: freqtradeorg/freqtrade:2025.12
    container_name: freqtrade
    restart: unless-stopped
    depends_on:
      concierge:
        condition: service_healthy
    environment:
      # Secret overrides (freqtrade reads FREQTRADE__SECTION__KEY).
      - FREQTRADE__TELEGRAM__TOKEN=${FT_TELEGRAM_TOKEN}
      - FREQTRADE__TELEGRAM__CHAT_ID=${FT_TELEGRAM_CHAT_ID}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQUI_PASSWORD}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQUI_JWT_SECRET}
      - FREQTRADE__API_SERVER__WS_TOKEN=${FREQUI_WS_TOKEN}
    volumes:
      - ./bot/user_data:/freqtrade/user_data
    ports:
      # FreqUI bound to loopback only — reach it via SSH tunnel / Tailscale.
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --config /freqtrade/user_data/config/config.dryrun.json
      --config /freqtrade/user_data/config/config.prod.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  concierge_data:
